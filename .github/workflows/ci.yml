name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rfc-3161-vs-opentimestamps
          - intel-tdx-remote-attestation-verifier
          - tamper-evident-audit-logs
          - ai-agent-audit-trail
          - the-two-mmlu-scores
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Fetch pinned upstream sources (the-two-mmlu-scores only)
        if: matrix.crate == 'the-two-mmlu-scores'
        run: sh the-two-mmlu-scores/scripts/fetch-pinned.sh

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.crate }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}

      - name: Format check
        run: cargo fmt --manifest-path ${{ matrix.crate }}/Cargo.toml --check

      - name: Test (locked, using the committed Cargo.lock)
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml --locked
        env:
          # Denies compiler warnings, not just clippy's. The two warnings
          # that appear inside unmodified post listings (a deprecated-API
          # warning in rfc-3161-vs-opentimestamps/listings/block-1.rs, a
          # clippy lint in listings/block-5.rs) are silenced at the source
          # by a `#[allow(...)]` on the private module each listing is
          # wrapped in (see src/tsp.rs and src/ots.rs there), not by a
          # crate- or CI-wide allow, so a new warning anywhere else still
          # fails this job.
          RUSTFLAGS: -D warnings

      - name: Clippy (denies warnings; see the RUSTFLAGS comment above)
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --locked -- -D warnings
